    const compressImageToBlob = (file) => {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const objectUrl = URL.createObjectURL(file); 
        
        img.onload = () => {
          URL.revokeObjectURL(objectUrl); 
          try {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 1080; 
            let scaleSize = 1;
            if (img.width > MAX_WIDTH) scaleSize = MAX_WIDTH / img.width;
            canvas.width = img.width * scaleSize;
            canvas.height = img.height * scaleSize;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob((blob) => {
              if (blob) resolve(blob);
              else reject(new Error('Canvas to Blob failed on this device'));
            }, 'image/jpeg', 0.80);
          } catch(err) {
            reject(err);
          }
        };
        
        img.onerror = (err) => {
          URL.revokeObjectURL(objectUrl);
          reject(new Error('Image load failed. Invalid image format.'));
        };
        
        img.src = objectUrl;
      });
    };

        } catch(e) {}

    };

    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null, errorInfo: null };
      }
      static getDerivedStateFromError(error) { return { hasError: true, error }; }
      componentDidCatch(error, errorInfo) {
        this.setState({ errorInfo });
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="absolute inset-0 bg-red-50 flex flex-col items-center justify-center p-6 text-red-900 z-[100]">
              <IconAlertTriangle className="w-16 h-16 text-red-500 mb-4" />

                <p className="font-bold text-red-600 mb-2">{this.state.error?.toString()}</p>
                <pre className="text-gray-600">{this.state.errorInfo?.componentStack}</pre>

                Reload Page
              </button>
            </div>
          );
        }
        return this.props.children;
      }

            for (let i = 0; i < fileArray.length; i++) {
              const file = fileArray[i];
              if (file && file.type && file.type.startsWith('image/')) {

                  const blob = await compressImageToBlob(file);
                  const publicUrl = await uploadImageToSupabase(blob);
                  newImageUrls.push(publicUrl);
                  
                  uploadedInSessionRef.current.push(publicUrl);
                } catch (err) {
                  console.error("Image processing/upload failed:", err);
                  uploadErrors++;
                  lastErrorMessage = err.message;
                }
              }
            }

            if (newImageUrls.length > 0) {
              setEditingProduct(prev => {
                const currentImages = prev.images || [];
                const updatedImages = [...currentImages, ...newImageUrls];
                return {
                  ...prev,
                  images: updatedImages,
                  mainImage: updatedImages[0] || '' 
                };
              });
            }

            if (uploadErrors > 0) {
              setSaveError(`Failed to upload ${uploadErrors} image(s). Reason: ${lastErrorMessage}`);
              showToast(`Upload completed with errors.`);
            } else if (newImageUrls.length > 0) {
              showToast('All images uploaded successfully!');
            }
            
        } catch (fatalError) {
            console.error("Fatal exception during upload:", fatalError);
            setSaveError("An unexpected error occurred. Please try again.");
        } finally {
            setIsUploadingImage(false);
            if (fileInputRef.current) fileInputRef.current.value = '';
            if (folderInputRef.current) folderInputRef.current.value = '';
        }
      };

          return { ...prev, images: newImages, mainImage: newImages[0] || '' };
        });

            newImages[index] = newImages[index - 1];

          } else if (direction === 'right' && index < newImages.length - 1) {

            newImages[index] = newImages[index + 1];

                    {Array.isArray(activeProduct.sizes) && activeProduct.sizes.length > 0 && (
                      <div className="mb-8">
                        <h3 className="text-sm font-bold text-gray-400 uppercase tracking-wider mb-3">Available Sizes</h3>
                        <div className="flex flex-wrap gap-2.5">
                          {activeProduct.sizes.map((size, idx) => <span key={idx} className="bg-white text-gray-900 text-sm font-bold px-5 py-2.5 rounded-xl border-2 border-gray-200 shadow-sm">{size}</span>)}
                        </div>
                      </div>
                    )}
                    {activeProduct.description && (
                      <div className="mb-8">
                        <h3 className="text-sm font-bold text-gray-400 uppercase tracking-wider mb-3">Product Details</h3>
                        <p className="text-sm text-gray-600 leading-relaxed whitespace-pre-line bg-gray-50 p-5 rounded-2xl">{activeProduct.description}</p>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ✨ 优化2：表单在手机上单列显示，避免内容挤压 */}
          {editingProduct && (
            <div className="fixed inset-0 z-[70] flex items-center justify-center p-0 sm:p-4 bg-black/80 backdrop-blur-md" onPaste={handlePaste}>
              <div className="bg-white sm:rounded-3xl w-full max-w-2xl h-full sm:h-auto sm:max-h-[90vh] flex flex-col shadow-2xl relative">
                <div className="p-4 sm:p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50 sm:rounded-t-3xl pt-12 sm:pt-6">
                  <h2 className="text-lg sm:text-xl font-bold text-gray-900 flex items-center gap-2">
                    <IconEdit3 className="w-5 h-5 sm:w-6 sm:h-6" />
                    {editingProduct.id ? 'Edit Item' : 'Upload New Item'}
                  </h2>
                  <button onClick={closeEditModal} className="text-gray-400 hover:text-gray-900 bg-white p-2 rounded-xl shadow-sm border border-gray-200 transition-colors"><IconX className="w-5 h-5" /></button>
                </div>
                <div className="p-4 sm:p-8 overflow-y-auto flex-1 relative">
                  {isUploadingImage && (
                    <div className="absolute inset-0 bg-white/80 backdrop-blur-sm z-20 flex flex-col items-center justify-center text-gray-900 rounded-xl">
                       <IconLoader className="w-10 h-10 animate-spin mb-3 text-emerald-500" />
                       <span className="font-bold text-sm">Uploading to Cloud...</span>
                    </div>
                  )}

                  {saveError && (
                    <div className="mb-6 bg-red-50 border border-red-200 p-4 rounded-2xl text-red-700 shadow-sm">
                      <h3 className="text-sm font-bold mb-2 flex items-center gap-2"><IconAlertTriangle className="w-4 h-4" />Upload Error</h3>
                      <p className="text-xs mb-2 leading-relaxed opacity-90">{saveError}</p>
                    </div>
                  )}
                  <form id="productForm" onSubmit={(e) => {
                    e.preventDefault();
                    if(isUploadingImage) return; 
                    const formData = new FormData(e.target);
                    const colorStr = formData.get('colors') || '';
                    const sizeStr = formData.get('sizes') || '';
                    if (!editingProduct.images || editingProduct.images.length === 0) { showToast('Please upload at least one image.'); return; }
                    handleSaveProduct({...editingProduct, name: formData.get('name'), category: formData.get('category'), shippingLocation: formData.get('shippingLocation'), colors: colorStr.split(',').map(s => s.trim()).filter(Boolean), sizes: sizeStr.split(',').map(s => s.trim()).filter(Boolean), description: formData.get('description')});
                  }} className="space-y-5 sm:space-y-6 text-sm">
                    <div className="bg-gray-50 border-2 border-dashed border-gray-300 rounded-2xl p-5 sm:p-6 relative">
                      <h3 className="text-sm font-bold text-gray-700 mb-4 flex items-center gap-2">
                        <IconImage className="w-5 h-5" /> Image Manager
                      </h3>
                      {Array.isArray(editingProduct.images) && editingProduct.images.length > 0 && (
                        <div className="flex flex-wrap gap-3 mb-5">
                          {editingProduct.images.map((img, idx) => (
                            <div key={idx} className="relative w-24 h-24 sm:w-28 sm:h-28 rounded-xl overflow-hidden border border-gray-200 bg-white shadow-sm">
                              <OptimizedImage src={img} alt={`Upload ${idx}`} className="w-full h-full object-cover" />
                              <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/80 to-transparent p-1 pt-4 flex justify-center items-center gap-2 opacity-100">
                                {idx > 0 ? (
                                  <button type="button" onClick={() => moveImage(idx, 'left')} className="text-white hover:scale-125 transition-transform p-1"><IconChevronLeft className="w-5 h-5" /></button>
                                ) : <div className="w-7"></div>}
                                <button type="button" onClick={() => removeImage(idx)} className="text-red-400 hover:scale-125 transition-transform p-1"><IconTrash2 className="w-4 h-4" /></button>
                                {idx < editingProduct.images.length - 1 ? (
                                  <button type="button" onClick={() => moveImage(idx, 'right')} className="text-white hover:scale-125 transition-transform p-1"><IconChevronRight className="w-5 h-5" /></button>
                                ) : <div className="w-7"></div>}
                              </div>
                              {idx === 0 && <span className="absolute top-1.5 left-1.5 bg-emerald-600 text-white text-[10px] px-2 py-0.5 rounded shadow-sm font-bold tracking-wider">COVER</span>}
                            </div>
                          ))}
                        </div>
                      )}
                      <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                        <input type="file" multiple accept="image/*" ref={fileInputRef} className="hidden" onChange={(e) => handleImageFiles(e.target.files)} />
                        <input type="file" webkitdirectory="true" directory="true" multiple ref={folderInputRef} className="hidden" onChange={(e) => handleImageFiles(e.target.files)} />
                        <button type="button" disabled={isUploadingImage} onClick={() => fileInputRef.current?.click()} className="flex-1 bg-white border border-gray-300 text-gray-700 px-4 py-3 rounded-xl flex items-center justify-center gap-2 hover:bg-gray-100 transition-colors font-bold disabled:opacity-50 shadow-sm"><IconImagePlus className="w-5 h-5" /> Select Files</button>
                        <button type="button" disabled={isUploadingImage} onClick={() => folderInputRef.current?.click()} className="flex-1 bg-white border border-gray-300 text-gray-700 px-4 py-3 rounded-xl flex items-center justify-center gap-2 hover:bg-gray-100 transition-colors font-bold disabled:opacity-50 shadow-sm"><IconFolderUp className="w-5 h-5" /> Upload Folder</button>
                      </div>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Product Name *</label>
                      <input name="name" defaultValue={editingProduct.name} required className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 sm:p-4 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all shadow-sm font-medium" />
                    </div>
                    {/* ✨ 手机端1列，电脑端2列 */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                      <div>
                        <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Category *</label>
                        <select name="category" defaultValue={editingProduct.category || safeCategories[0]} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 sm:p-4 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none shadow-sm font-medium">
                          {safeCategories.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Shipping From *</label>
                        <select name="shippingLocation" defaultValue={editingProduct.shippingLocation || 'In Stock (Phnom Penh)'} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 sm:p-4 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none shadow-sm font-medium">
                          <option value="In Stock (Phnom Penh)">In Stock (Phnom Penh)</option>
                          <option value="Send from China (approx. 10 days)">Send from China (approx. 10 days)</option>
                        </select>
                      </div>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                      <div>
                        <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Colors (comma separated)</label>
                        <input name="colors" defaultValue={Array.isArray(editingProduct.colors) ? editingProduct.colors.join(', ') : editingProduct.colors} placeholder="e.g. Black, White" className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 sm:p-4 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none shadow-sm font-medium" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Sizes (comma separated)</label>
                        <input name="sizes" defaultValue={Array.isArray(editingProduct.sizes) ? editingProduct.sizes.join(', ') : editingProduct.sizes} placeholder="e.g. S, M, L" className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 sm:p-4 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none shadow-sm font-medium" />
                      </div>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Description</label>
                      <textarea name="description" rows="4" defaultValue={editingProduct.description} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 sm:p-4 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none shadow-sm resize-none font-medium leading-relaxed" />
                    </div>
                  </form>
                </div>
                <div className="p-4 sm:p-6 border-t border-gray-100 flex gap-4 bg-white sm:rounded-b-3xl pb-8 sm:pb-6 shadow-[0_-10px_40px_-15px_rgba(0,0,0,0.1)]">
                  <button type="button" onClick={closeEditModal} className="flex-1 bg-gray-100 py-3.5 sm:py-4 rounded-xl text-gray-700 font-bold hover:bg-gray-200 transition-colors">Cancel</button>
                  <button form="productForm" type="submit" disabled={isUploadingImage} className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 sm:py-4 rounded-xl font-bold shadow-lg shadow-emerald-500/30 transition-all disabled:opacity-50 disabled:shadow-none">
                    {isUploadingImage ? 'Processing...' : 'Save Product'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Edit Categories Modal */}
          {isCategoryEditOpen && (
            <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="bg-white rounded-3xl w-full max-w-md p-6 sm:p-8 shadow-2xl relative">
                <button onClick={() => setIsCategoryEditOpen(false)} className="absolute top-6 right-6 text-gray-400 hover:text-gray-900 bg-gray-100 p-2 rounded-xl"><IconX className="w-5 h-5" /></button>
                <h2 className="text-xl font-bold text-gray-900 mb-6">Manage Categories</h2>
                <div className="space-y-3 mb-6 max-h-60 overflow-y-auto pr-2">
                  {safeCategories.map((cat, index) => (
                    <div key={index} className="flex justify-between items-center bg-gray-50 p-3 sm:p-4 rounded-2xl border border-gray-200">
                      <span className="text-sm font-bold text-gray-700">{cat}</span>
                      <button onClick={() => { const newList = [...safeCategories]; newList.splice(index, 1); setDynamicCategories(newList); handleSaveCategories(newList); }} className="text-red-400 hover:text-red-600 bg-red-50 p-2 rounded-lg"><IconTrash2 className="w-4 h-4" /></button>
                    </div>
                  ))}
                </div>
                <form onSubmit={(e) => { e.preventDefault(); const newCat = e.target.newCategory.value.trim(); if (newCat && !safeCategories.includes(newCat)) { const newList = [...safeCategories, newCat]; setDynamicCategories(newList); handleSaveCategories(newList); e.target.reset(); } }} className="flex gap-3">
                  <input name="newCategory" placeholder="New category name..." required className="flex-1 bg-gray-50 border border-gray-200 rounded-xl p-3 sm:p-4 text-sm font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500" />
                  <button type="submit" className="bg-emerald-600 text-white px-6 rounded-xl text-sm font-bold shadow-lg shadow-emerald-500/30">Add</button>
                </form>
              </div>
            </div>
          )}

          {/* Edit Header Banner Modal */}
          {isShopEditOpen && (
            <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="bg-white rounded-3xl w-full max-w-md p-6 sm:p-8 shadow-2xl relative">
                <button onClick={() => setIsShopEditOpen(false)} className="absolute top-6 right-6 text-gray-400 hover:text-gray-900 bg-gray-100 p-2 rounded-xl"><IconX className="w-5 h-5" /></button>
                <h2 className="text-xl font-bold text-gray-900 mb-6">Edit Store Banner</h2>
                <form onSubmit={(e) => { e.preventDefault(); const formData = new FormData(e.target); const newInfo = { name: formData.get('name'), notice: formData.get('notice'), banner: formData.get('banner') }; handleSaveShopInfo(newInfo); }} className="space-y-5 text-sm">
                  <div><label className="block font-bold text-gray-500 uppercase tracking-wider mb-2 text-xs">Gallery Name</label><input name="name" defaultValue={shopInfo.name} required className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3.5 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 font-bold text-gray-900" /></div>
                  <div><label className="block font-bold text-gray-500 uppercase tracking-wider mb-2 text-xs">Subtitle / Notice</label><input name="notice" defaultValue={shopInfo.notice} required className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3.5 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 font-medium text-gray-700" /></div>
                  <div><label className="block font-bold text-gray-500 uppercase tracking-wider mb-2 text-xs">Background Image (URL)</label><input name="banner" defaultValue={shopInfo.banner} required className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3.5 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 font-mono text-xs text-gray-600" /></div>
                  <button type="submit" className="w-full bg-emerald-600 text-white py-4 rounded-xl font-bold mt-4 shadow-lg shadow-emerald-500/30">Save Changes</button>
                </form>
              </div>
            </div>
          )}

          {/* Admin Verification Modal */}
          {showAdminPassModal && (
            <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="bg-white rounded-3xl w-full max-w-sm p-6 sm:p-8 shadow-2xl relative">
                <button onClick={() => setShowAdminPassModal(false)} className="absolute top-6 right-6 text-gray-400 hover:text-gray-900 bg-gray-100 p-2 rounded-xl"><IconX className="w-5 h-5" /></button>
                <div className="w-16 h-16 bg-emerald-100 rounded-2xl flex items-center justify-center mb-6">
                  <IconShield className="w-8 h-8 text-emerald-600" />
                </div>
                <h3 className="text-xl font-bold text-gray-900 mb-6">Admin Login</h3>
                {saveError && <div className="mb-5 text-sm text-red-700 font-medium bg-red-50 p-3 rounded-xl border border-red-200">{saveError}</div>}
                <form onSubmit={handleVerifyAdminPass} className="space-y-4">
                  <input type="password" placeholder="Enter password" value={adminPasswordInput} onChange={(e) => setAdminPasswordInput(e.target.value)} className="w-full bg-gray-50 border border-gray-200 rounded-xl p-4 text-sm font-medium tracking-widest focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 text-center" />
                  <button type="submit" className="w-full bg-emerald-600 text-white py-4 rounded-xl font-bold text-sm shadow-lg shadow-emerald-500/30">Unlock Access</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <GalleryApp />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
